<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Rich Obsidian Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181A1C" />
      <stop offset="100%" stop-color="#08090A" />
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5E0" />
      <stop offset="25%" stop-color="#E5CA92" />
      <stop offset="55%" stop-color="#BA9D6A" />
      <stop offset="85%" stop-color="#8C734B" />
      <stop offset="100%" stop-color="#C2A774" />
    </linearGradient>

    <!-- Deep Gold Gradient -->
    <linearGradient id="goldLetter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="20%" stop-color="#FCEFD2" />
      <stop offset="50%" stop-color="#BA9D6A" />
      <stop offset="100%" stop-color="#7A6139" />
    </linearGradient>

    <!-- Gold Shadow Glow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#BA9D6A" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Circular Outer Background -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)" stroke="url(#goldSheen)" stroke-width="12" />

  <!-- Inner Geometric Cutout Frame (Signature Logo Emblem scaled large for favicon visibility) -->
  <g filter="url(#goldGlow)" transform="translate(256, 256) scale(3.5) translate(-50, -50)">
    <!-- Top-Left & Bottom Corner Stroke -->
    <path d="M10 32 V12 H78" stroke="url(#goldSheen)" stroke-width="4.5" stroke-linecap="square" />
    <!-- Bottom-Right & Top Corner Stroke -->
    <path d="M90 68 V88 H22" stroke="url(#goldSheen)" stroke-width="4.5" stroke-linecap="square" />

    <!-- Left Vertical Accent Notch -->
    <line x1="10" y1="48" x2="10" y2="74" stroke="url(#goldSheen)" stroke-width="4.5" stroke-linecap="square" />
    <!-- Right Vertical Accent Notch -->
    <line x1="90" y1="26" x2="90" y2="52" stroke="url(#goldSheen)" stroke-width="4.5" stroke-linecap="square" />

    <!-- Center Stylized Metallic Serif 'N' -->
    <!-- Left Stem -->
    <path d="M26 73 V27 L33 27 V73 H26 Z" fill="url(#goldLetter)" />
    <!-- Left Serif Caps -->
    <path d="M21 28 H38 V24 H21 V28 Z M21 76 H38 V72 H21 V76 Z" fill="url(#goldLetter)" />

    <!-- Right Stem -->
    <path d="M67 73 V27 L74 27 V73 H67 Z" fill="url(#goldLetter)" />
    <!-- Right Serif Caps -->
    <path d="M62 28 H79 V24 H62 V28 Z M62 76 H79 V72 H62 V76 Z" fill="url(#goldLetter)" />

    <!-- Dynamic Diagonal Ribbon Swash -->
    <path d="M32 27 C42 42, 54 58, 68 73 C58 58, 48 40, 36 27 Z" fill="url(#goldSheen)" />
    <path d="M28 33 C40 48, 55 64, 72 70 C56 63, 44 48, 32 33 Z" fill="url(#goldLetter)" opacity="0.95" />
  </g>
</svg>
